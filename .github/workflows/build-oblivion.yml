# On the darkmessiah-dev branch this file builds Dark Messiah, not Oblivion.
# workflow_dispatch only accepts workflows that exist on main, and pushing a
# new workflow to main triggers the upstream CI, so this branch reuses the
# Oblivion workflow id: `gh workflow run build-oblivion.yml --ref darkmessiah-dev`.
name: Build Dark Messiah

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x86

      - name: Configure build for x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Configure CMake (x86)
        run: cmake --preset clang-x86 -DCMAKE_C_COMPILER_TARGET=i686-pc-windows-msvc

      - name: Build renodx-darkmessiah.addon32
        run: cmake --build --preset clang-x86-release --target darkmessiah --verbose

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: renodx-darkmessiah
          # The PDB lets crash dumps be symbolized.
          path: |
            build32/release/renodx-darkmessiah.addon32
            build32/release/renodx-darkmessiah.pdb
          if-no-files-found: error
