name: Build Oblivion

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x86

      - name: Configure build for x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Configure CMake (x86)
        run: cmake --preset clang-x86 -DCMAKE_C_COMPILER_TARGET=i686-pc-windows-msvc

      - name: Build renodx-oblivion.addon32
        run: cmake --build --preset clang-x86-release --target oblivion --verbose

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: renodx-oblivion
          # The PDB lets crash dumps be symbolized.
          path: |
            build32/release/renodx-oblivion.addon32
            build32/release/renodx-oblivion.pdb
          if-no-files-found: error

      # Live inspection tooling (see docs/DEVKIT_MCP.md); debug builds as the
      # setup-game-mod-dev skill recommends.
      # The game addon must match the DevKit build type: RenoDX addons share
      # STL containers across modules, and Debug/Release layouts differ.
      - name: Build DevKit, MCP bridge and debug addon
        run: cmake --build --preset clang-x86-debug --target devkit mcp_bridge oblivion

      - name: Upload DevKit
        uses: actions/upload-artifact@v4
        with:
          name: renodx-devkit
          path: |
            build32/debug/renodx-devkit.addon32
            build32/debug/renodx-mcp-bridge.exe
            build32/debug/renodx-oblivion.addon32
            build32/debug/renodx-oblivion.pdb
          if-no-files-found: error
